name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Verify the packed datastore mappings match their .ds sources
        run: |
          node scripts/pack-mappings.mjs
          git diff --exit-code config/datastore/ \
            || (echo "::error::config/datastore/*.json is out of date — run 'yarn mappings:pack' and commit." && exit 1)
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Test mediator (DataSonnet mapping tests + route tests against a mocked DHIS2)
        run: mvn -B clean test -f mediator/pom.xml

  integration-tests:
    # The *IT suites: the mediator against a REAL DHIS2 (Testcontainers + the
    # ENABLE dump) — real import semantics, idempotent re-push, SCHEDULE lifecycle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Integration tests (Testcontainers boots dhis2/core + the dump)
        run: mvn -B clean verify -f mediator/pom.xml
